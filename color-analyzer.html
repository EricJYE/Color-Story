<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="manifest" href="manifest.json"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Color Story · 色彩分析</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap');

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#f7f5f0;--text:#1c1c1c;--text2:#888;
      --radius:16px;--font-display:'DM Serif Display',serif;--font-body:'DM Sans',sans-serif;
    }
    body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;padding:2rem 1rem 4rem;display:flex;flex-direction:column;align-items:center;}

    h1{font-family:var(--font-display);font-size:2rem;font-weight:400;letter-spacing:-0.01em;margin-bottom:0.2rem;text-align:center}
    .sub{font-size:12px;color:var(--text2);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:2rem;text-align:center}

    /* Upload zone */
    .upload-zone{
      width:100%;max-width:560px;
      border:1.5px dashed rgba(0,0,0,0.15);
      border-radius:20px;
      padding:2.5rem 2rem;
      text-align:center;
      cursor:pointer;
      transition:border-color .2s, background .2s;
      background:rgba(255,255,255,0.6);
      position:relative;
      margin-bottom:1.5rem;
    }
    .upload-zone:hover,.upload-zone.drag{border-color:rgba(0,0,0,0.35);background:rgba(255,255,255,0.9)}
    .upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
    .upload-icon{font-size:2rem;margin-bottom:0.75rem;opacity:0.4}
    .upload-text{font-size:14px;color:var(--text2)}
    .upload-text strong{color:var(--text);font-weight:500}

    /* Preview */
    .preview-wrap{width:100%;max-width:560px;margin-bottom:1.5rem;display:none}
    .preview-img{width:100%;max-height:360px;object-fit:cover;border-radius:20px;display:block}

    /* Palette strip */
    .palette-strip{display:flex;width:100%;max-width:560px;height:64px;border-radius:14px;overflow:hidden;margin-bottom:1rem;display:none}
    .palette-swatch{flex:1;transition:flex .4s cubic-bezier(.4,0,.2,1);cursor:pointer;position:relative}
    .palette-swatch:hover{flex:2.5}
    .palette-swatch .sw-hex{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:500;letter-spacing:0.04em;opacity:0;transition:opacity .2s;white-space:nowrap;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,0.25);color:#fff}
    .palette-swatch:hover .sw-hex{opacity:1}

    /* Color cards */
    .colors-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;width:100%;max-width:560px;margin-bottom:1.5rem;display:none}
    .color-card{border-radius:14px;overflow:hidden;background:white;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
    .color-swatch{height:80px;width:100%}
    .color-info{padding:10px 12px}
    .color-hex{font-size:13px;font-weight:500;letter-spacing:0.04em;margin-bottom:2px}
    .color-name{font-size:11px;color:var(--text2);margin-bottom:4px}
    .color-vals{font-size:10px;color:#aaa;line-height:1.5}

    /* Harmony analysis */
    .harmony-wrap{width:100%;max-width:560px;display:none}
    .harmony-card{background:white;border-radius:20px;padding:1.5rem;box-shadow:0 2px 12px rgba(0,0,0,0.06);margin-bottom:10px}
    .harmony-title{font-family:var(--font-display);font-size:1.1rem;font-weight:400;margin-bottom:0.3rem}
    .harmony-desc{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:1rem}
    .harmony-dots{display:flex;gap:8px;flex-wrap:wrap}
    .harmony-dot{width:32px;height:32px;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,0.12)}
    .tag{display:inline-block;font-size:10px;padding:3px 8px;border-radius:20px;background:rgba(0,0,0,0.06);color:var(--text2);margin-bottom:8px;letter-spacing:0.04em;text-transform:uppercase}

    /* Reset btn */
    .reset-btn{display:none;margin-top:0.5rem;font-size:12px;color:var(--text2);background:none;border:none;cursor:pointer;letter-spacing:0.06em;text-transform:uppercase;text-decoration:underline;font-family:var(--font-body)}

    @media(max-width:480px){
      h1{font-size:1.6rem}
      .colors-grid{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>
<body>

<h1>Color Story</h1>
<p class="sub">场景色彩分析</p>

<div class="upload-zone" id="upload-zone">
  <input type="file" id="file-input" accept="image/*" capture="environment"/>
  <div class="upload-icon">⬡</div>
  <p class="upload-text"><strong>点击上传或拍照</strong></p>
  <p class="upload-text" style="margin-top:4px;font-size:12px">支持 JPG、PNG、HEIC</p>
</div>

<div class="preview-wrap" id="preview-wrap">
  <img class="preview-img" id="preview-img" />
</div>

<div class="palette-strip" id="palette-strip"></div>
<div class="colors-grid" id="colors-grid"></div>
<div class="harmony-wrap" id="harmony-wrap"></div>
<button class="reset-btn" id="reset-btn" onclick="reset()">重新上传</button>

<canvas id="canvas" style="display:none"></canvas>

<script>
  const COLOR_NAMES = {
    red:['大红','深红','玫红','砖红','酒红'],
    orange:['橘橙','焦糖','琥珀','橘黄','杏色'],
    yellow:['柠黄','金黄','奶油','香槟','姜黄'],
    green:['翠绿','橄榄','苔绿','薄荷','墨绿'],
    teal:['青绿','水鸭','碧色','湖绿','松石'],
    blue:['宝蓝','天蓝','海军','靛蓝','钴蓝'],
    purple:['紫罗兰','薰衣草','深紫','葡萄','丁香'],
    pink:['玫粉','桃粉','胭脂','浅粉','珊瑚'],
    brown:['咖啡','焦糖','栗棕','大地','燕麦'],
    gray:['银灰','炭灰','烟灰','石灰','铅灰'],
    white:['象牙白','米白','雪白','奶白','珍珠'],
    black:['炭黑','深黑','墨色','夜黑','乌黑'],
  };

  function getColorName(hex) {
    const c = chroma(hex);
    const h = c.get('hsl.h'), s = c.get('hsl.s'), l = c.get('hsl.l');
    let hue;
    if (l > 0.88) hue = 'white';
    else if (l < 0.12) hue = 'black';
    else if (s < 0.12) hue = 'gray';
    else if (h < 20 || h >= 340) hue = 'red';
    else if (h < 45) hue = 'orange';
    else if (h < 70) hue = 'yellow';
    else if (h < 150) hue = 'green';
    else if (h < 185) hue = 'teal';
    else if (h < 255) hue = 'blue';
    else if (h < 290) hue = 'purple';
    else hue = 'pink';
    const names = COLOR_NAMES[hue] || COLOR_NAMES.gray;
    // pick based on lightness
    const idx = Math.min(Math.floor(l * names.length), names.length - 1);
    return names[idx];
  }

  function analyzeHarmony(hexes) {
    if (hexes.length < 2) return [];
    const hues = hexes.map(h => chroma(h).get('hsl.h'));
    const sats = hexes.map(h => chroma(h).get('hsl.s'));
    const lums = hexes.map(h => chroma(h).get('hsl.l'));
    const avgSat = sats.reduce((a,b)=>a+b,0)/sats.length;
    const results = [];

    // Hue spread
    const sortedH = [...hues].sort((a,b)=>a-b);
    const maxSpread = sortedH[sortedH.length-1] - sortedH[0];
    const hueDiffs = hues.map((h,i) => hues.map((h2,j) => i!==j ? Math.min(Math.abs(h-h2), 360-Math.abs(h-h2)) : 999)).flat().filter(x=>x<999);
    const minDiff = Math.min(...hueDiffs);
    const maxDiff = Math.max(...hueDiffs);

    if (maxSpread < 30 || maxDiff < 35) {
      results.push({
        type:'同类色搭配',
        tag:'ANALOGOUS',
        desc:'图中色彩色相接近，整体和谐统一，营造出宁静、内敛的视觉氛围。常见于自然风光和极简风格。',
        colors: hexes,
      });
    }
    if (maxDiff > 150 && maxDiff < 210) {
      results.push({
        type:'互补色搭配',
        tag:'COMPLEMENTARY',
        desc:'色轮上相对的两种颜色同时出现，形成强烈的视觉张力与对比，让画面充满活力与戏剧感。',
        colors: hexes,
      });
    }
    if (maxDiff > 100 && maxDiff < 150) {
      results.push({
        type:'分裂互补',
        tag:'SPLIT-COMPLEMENTARY',
        desc:'主色与互补色两侧的颜色搭配，既有对比又不过于刺激，是摄影中常见的平衡配色方式。',
        colors: hexes,
      });
    }
    if (avgSat < 0.18) {
      results.push({
        type:'低饱和配色',
        tag:'MUTED / DESATURATED',
        desc:'整体色调柔和克制，饱和度低，呈现出胶片感或雾面质感，适合人文、纪实风格。',
        colors: hexes,
      });
    }
    if (avgSat > 0.6 && maxSpread > 60) {
      results.push({
        type:'高饱和撞色',
        tag:'VIBRANT',
        desc:'高饱和度的多种颜色共存，画面充满能量与视觉冲击力，常见于街头、节日或热带风光。',
        colors: hexes,
      });
    }
    const lumSpread = Math.max(...lums) - Math.min(...lums);
    if (lumSpread > 0.55) {
      results.push({
        type:'明暗对比',
        tag:'HIGH CONTRAST',
        desc:'画面中明区与暗区并存，对比强烈，有助于突出主体，增强空间感与戏剧性。',
        colors: hexes,
      });
    }
    // Always give at least one result
    if (results.length === 0) {
      results.push({
        type:'自然色调',
        tag:'NATURAL',
        desc:'色彩分布自然均衡，没有明显的对比或统一倾向，呈现出真实、平和的视觉感受。',
        colors: hexes,
      });
    }
    return results;
  }

  function extractColors(img, count=6) {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const MAX = 200;
    const scale = Math.min(MAX/img.naturalWidth, MAX/img.naturalHeight, 1);
    canvas.width = img.naturalWidth * scale;
    canvas.height = img.naturalHeight * scale;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

    // Sample pixels
    const pixels = [];
    for (let i = 0; i < data.length; i += 4*4) {
      const r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
      if (a < 128) continue;
      pixels.push([r,g,b]);
    }

    // k-means clustering
    function dist(a,b){ return Math.sqrt((a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2) }
    // init centroids spread across samples
    const step = Math.floor(pixels.length / count);
    let centroids = Array.from({length:count},(_,i)=>[...pixels[i*step]||pixels[0]]);

    for (let iter=0; iter<12; iter++) {
      const clusters = Array.from({length:count},()=>[]);
      pixels.forEach(p=>{
        let best=0, bd=Infinity;
        centroids.forEach((c,i)=>{ const d=dist(p,c); if(d<bd){bd=d;best=i} });
        clusters[best].push(p);
      });
      centroids = clusters.map((cl,i)=>{
        if(!cl.length) return centroids[i];
        return [
          cl.reduce((s,p)=>s+p[0],0)/cl.length,
          cl.reduce((s,p)=>s+p[1],0)/cl.length,
          cl.reduce((s,p)=>s+p[2],0)/cl.length,
        ];
      });
    }

    // Sort by luminance
    return centroids
      .map(c=>chroma(Math.round(c[0]),Math.round(c[1]),Math.round(c[2]),'rgb').hex())
      .sort((a,b)=>chroma(b).get('hsl.l')-chroma(a).get('hsl.l'));
  }

  function render(hexes) {
    // Palette strip
    const strip = document.getElementById('palette-strip');
    strip.innerHTML = '';
    hexes.forEach(hex=>{
      const sw = document.createElement('div');
      sw.className = 'palette-swatch';
      sw.style.background = hex;
      const label = document.createElement('span');
      label.className = 'sw-hex';
      label.textContent = hex.toUpperCase();
      sw.appendChild(label);
      strip.appendChild(sw);
    });
    strip.style.display = 'flex';

    // Color cards
    const grid = document.getElementById('colors-grid');
    grid.innerHTML = '';
    hexes.forEach(hex=>{
      const c = chroma(hex);
      const [h,s,l] = c.hsl();
      const card = document.createElement('div');
      card.className = 'color-card';
      card.innerHTML = `
        <div class="color-swatch" style="background:${hex}"></div>
        <div class="color-info">
          <div class="color-hex">${hex.toUpperCase()}</div>
          <div class="color-name">${getColorName(hex)}</div>
          <div class="color-vals">
            RGB ${c.rgb().map(Math.round).join(', ')}<br>
            HSL ${Math.round(h||0)}° ${Math.round(s*100)}% ${Math.round(l*100)}%
          </div>
        </div>`;
      grid.appendChild(card);
    });
    grid.style.display = 'grid';

    // Harmony
    const hw = document.getElementById('harmony-wrap');
    hw.innerHTML = '';
    const harmonies = analyzeHarmony(hexes);
    harmonies.forEach(h=>{
      const card = document.createElement('div');
      card.className = 'harmony-card';
      const dots = h.colors.map(c=>`<div class="harmony-dot" style="background:${c}"></div>`).join('');
      card.innerHTML = `
        <span class="tag">${h.tag}</span>
        <div class="harmony-title">${h.type}</div>
        <div class="harmony-desc">${h.desc}</div>
        <div class="harmony-dots">${dots}</div>`;
      hw.appendChild(card);
    });
    hw.style.display = 'block';

    document.getElementById('reset-btn').style.display = 'block';
  }

  document.getElementById('file-input').addEventListener('change', function(e){
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = document.getElementById('preview-img');
      img.onload = () => {
        document.getElementById('upload-zone').style.display = 'none';
        document.getElementById('preview-wrap').style.display = 'block';
        const hexes = extractColors(img, 6);
        render(hexes);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  // Drag and drop
  const zone = document.getElementById('upload-zone');
  zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('drag') });
  zone.addEventListener('dragleave', ()=>zone.classList.remove('drag'));
  zone.addEventListener('drop', e=>{
    e.preventDefault(); zone.classList.remove('drag');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
      const dt = new DataTransfer();
      dt.items.add(file);
      document.getElementById('file-input').files = dt.files;
      document.getElementById('file-input').dispatchEvent(new Event('change'));
    }
  });

  function reset() {
    document.getElementById('upload-zone').style.display = 'block';
    document.getElementById('preview-wrap').style.display = 'none';
    document.getElementById('palette-strip').style.display = 'none';
    document.getElementById('colors-grid').style.display = 'none';
    document.getElementById('harmony-wrap').style.display = 'none';
    document.getElementById('reset-btn').style.display = 'none';
    document.getElementById('file-input').value = '';
  }
</script>
</body>
</html>
